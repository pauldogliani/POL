<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Syne, Space Grotesk, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Syne', 'sans-serif'],
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.4, transform: 'scale(1)' },
                            '50%': { opacity: 0.75, transform: 'scale(1.06)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent-primary: #a855f7;
            --accent-secondary: #f59e0b;
            --accent-glow: rgba(168, 85, 247, 0.28);
        }

        body {
            background-color: #060609;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .bg-noise {
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #060609;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1e2d;
            border-radius: 9999px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(14, 14, 22, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(22, 22, 34, 0.78) 0%, rgba(10, 10, 16, 0.88) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: 0 18px 36px -12px var(--accent-glow);
        }

        .glass-card.playing-card {
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px -5px var(--accent-glow);
        }

        .vinyl-disc {
            background: 
                radial-gradient(circle, #0e0e14 18%, transparent 19%),
                repeating-radial-gradient(circle, #0c0c10 0%, #0c0c10 2px, #191922 3px, #0c0c10 4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card-enter {
            animation: cardEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
        }

        @keyframes eqBar1 { 0%, 100% { height: 25%; } 50% { height: 95%; } }
        @keyframes eqBar2 { 0%, 100% { height: 85%; } 33% { height: 20%; } 66% { height: 100%; } }
        @keyframes eqBar3 { 0%, 100% { height: 40%; } 25% { height: 100%; } 75% { height: 30%; } }
        .eq-bar-1 { animation: eqBar1 0.65s ease-in-out infinite; }
        .eq-bar-2 { animation: eqBar2 0.5s ease-in-out infinite; }
        .eq-bar-3 { animation: eqBar3 0.75s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-28 selection:bg-purple-500 selection:text-white relative">

    <!-- EMBEDDED REQUESTS MANIFEST (Permet de stocker en dur les demandes lors de l'export d'index.html) -->
    <script id="pol-embedded-requests" type="application/json">[]</script>

    <!-- Ambient Background Glows -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div id="ambient-orb-1" class="absolute -top-40 -left-40 w-[520px] h-[520px] rounded-full blur-[150px] opacity-35 transition-all duration-1000" style="background: radial-gradient(circle, #a855f7, transparent 70%);"></div>
        <div id="ambient-orb-2" class="absolute top-1/3 -right-40 w-[480px] h-[480px] rounded-full blur-[150px] opacity-25 transition-all duration-1000" style="background: radial-gradient(circle, #f59e0b, transparent 70%);"></div>
        <div id="ambient-orb-3" class="absolute -bottom-48 left-1/3 w-[560px] h-[400px] rounded-full blur-[160px] opacity-20 transition-all duration-1000" style="background: radial-gradient(circle, #ec4899, transparent 70%);"></div>
        <div class="absolute inset-0 bg-noise opacity-60"></div>
    </div>

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 backdrop-blur-xl bg-[#060609]/80 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3.5 flex items-center justify-between gap-4">
            <!-- Brand -->
            <div class="flex items-center gap-3 cursor-pointer group" onclick="window.switchSpace('all')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-amber-500 p-[1px] shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform">
                    <div class="w-full h-full bg-[#09090f] rounded-xl flex items-center justify-center">
                        <i data-lucide="disc-3" class="w-5 h-5 text-white group-hover:rotate-90 transition-transform duration-500"></i>
                    </div>
                </div>
                <span class="font-display font-extrabold text-2xl tracking-wider text-white">POL</span>
            </div>

            <!-- Add / Upload Button -->
            <button 
                onclick="window.openAdminPortal()"
                class="relative group overflow-hidden rounded-full p-[1px] focus:outline-none"
            >
                <span class="absolute inset-0 bg-gradient-to-r from-purple-500 via-amber-500 to-rose-500 rounded-full opacity-75 group-hover:opacity-100 transition-opacity"></span>
                <div class="relative bg-[#0c0c14] hover:bg-[#141422] text-white px-4 py-2 rounded-full flex items-center gap-2 text-xs sm:text-sm font-medium transition-colors">
                    <i data-lucide="lock" id="admin-lock-icon" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span>Ajouter</span>
                </div>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-6 pb-12 flex-grow">

        <!-- Spaces Navigation Tabs -->
        <nav aria-label="Espaces" class="mb-6">
            <div class="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar" id="spaces-tabs-container"></div>
        </nav>

        <!-- Minimalist Space Header (Title, Lecture/Ajouter & Vinyl Showcase) -->
        <section class="relative rounded-3xl glass-panel p-6 sm:p-8 mb-8 overflow-hidden border border-white/10">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
                <div class="space-y-5 text-center sm:text-left">
                    <h1 id="hero-title" class="font-display font-extrabold text-2xl sm:text-4xl lg:text-5xl tracking-tight text-white leading-tight transition-all duration-300">
                        POL
                    </h1>
                    <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3">
                        <button onclick="window.playSpaceTracks()" class="px-5 py-2.5 rounded-full bg-white text-black font-semibold text-sm flex items-center gap-2 hover:scale-105 active:scale-95 transition-all shadow-lg shadow-white/10">
                            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                            <span>Lecture</span>
                        </button>
                        <button onclick="window.openAdminPortal()" class="px-5 py-2.5 rounded-full bg-white/5 hover:bg-white/10 text-zinc-200 border border-white/10 font-medium text-sm flex items-center gap-2 transition-all">
                            <i data-lucide="plus" class="w-4 h-4 text-amber-400"></i>
                            <span>Ajouter</span>
                        </button>
                    </div>
                </div>

                <!-- Animated Vinyl Showcase Widget -->
                <div class="relative w-32 h-32 sm:w-40 sm:h-40 flex items-center justify-center shrink-0">
                    <div id="hero-vinyl-glow" class="absolute inset-0 rounded-full blur-2xl opacity-45 animate-pulse-glow transition-colors duration-700" style="background: conic-gradient(from 0deg, #a855f7, #f59e0b, #ec4899, #a855f7);"></div>
                    <div id="hero-vinyl" class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-full vinyl-disc flex items-center justify-center border border-white/15">
                        <img id="hero-vinyl-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=400&q=80" alt="POL" class="w-12 h-12 sm:w-16 sm:h-16 rounded-full object-cover border border-white/20">
                        <div class="absolute w-3 h-3 rounded-full bg-[#060609] border border-white/30"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Track Cards Grid -->
        <section>
            <div id="tracks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <!-- Minimal Empty State -->
            <div id="empty-state" class="hidden glass-panel rounded-3xl p-12 text-center max-w-sm mx-auto my-6 border border-dashed border-white/15">
                <button onclick="window.openAdminPortal()" class="px-6 py-3 rounded-full bg-white text-black text-sm font-semibold inline-flex items-center gap-2 hover:scale-105 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Ajouter</span>
                </button>
            </div>
        </section>
    </main>

    <!-- Persistent Bottom Audio Player -->
    <footer class="fixed bottom-0 inset-x-0 z-40 backdrop-blur-2xl bg-[#07070c]/95 border-t border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="grid grid-cols-1 md:grid-cols-12 items-center gap-3 md:gap-6">
                
                <!-- Currently Playing Track -->
                <div class="md:col-span-4 flex items-center gap-3 min-w-0">
                    <div class="relative w-12 h-12 rounded-xl overflow-hidden shrink-0 border border-white/15 bg-zinc-900">
                        <img id="player-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=200&q=80" alt="PP" class="w-full h-full object-cover">
                    </div>
                    <div class="min-w-0 flex-1">
                        <h4 id="player-title" class="font-display font-bold text-sm text-white truncate">POL</h4>
                        <span id="player-space-badge" class="text-xs font-mono text-purple-400 truncate block">POL</span>
                    </div>
                </div>

                <!-- Controls & Seek -->
                <div class="md:col-span-5 flex flex-col items-center justify-center gap-1">
                    <div class="flex items-center gap-5">
                        <button onclick="window.prevTrack()" class="text-zinc-400 hover:text-white transition p-1">
                            <i data-lucide="skip-back" class="w-4 h-4"></i>
                        </button>
                        <button id="master-play-btn" onclick="window.togglePlay()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition">
                            <i data-lucide="play" id="master-play-icon" class="w-4 h-4 fill-current ml-0.5"></i>
                        </button>
                        <button onclick="window.nextTrack()" class="text-zinc-400 hover:text-white transition p-1">
                            <i data-lucide="skip-forward" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="w-full flex items-center gap-2.5">
                        <span id="player-current-time" class="text-[10px] font-mono text-zinc-400 w-8 text-right">0:00</span>
                        <div class="relative flex-1 flex items-center">
                            <input type="range" id="player-seek" min="0" max="100" value="0" step="0.1" class="w-full z-10">
                            <div id="player-progress-fill" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 rounded-full bg-gradient-to-r from-purple-500 to-amber-400 pointer-events-none" style="width: 0%;"></div>
                        </div>
                        <span id="player-duration" class="text-[10px] font-mono text-zinc-400 w-8">0:00</span>
                    </div>
                </div>

                <!-- Visualizer & Volume -->
                <div class="hidden md:flex md:col-span-3 items-center justify-end gap-3">
                    <div class="bg-white/5 border border-white/10 rounded-xl px-2.5 py-1 flex items-center">
                        <canvas id="visualizer-canvas" width="88" height="24" class="w-22 h-6"></canvas>
                    </div>
                    <div class="flex items-center gap-2 w-24">
                        <button onclick="window.toggleMute()" class="text-zinc-400 hover:text-white transition">
                            <i data-lucide="volume-2" id="volume-icon" class="w-4 h-4"></i>
                        </button>
                        <input type="range" id="player-volume" min="0" max="1" step="0.02" value="0.85" class="w-full">
                    </div>
                </div>

            </div>
        </div>
    </footer>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-xl overflow-y-auto">
        
        <!-- Password Gate -->
        <div id="password-gate-view" class="glass-panel rounded-3xl max-w-sm w-full p-6 border border-white/15 relative my-auto animate-card-enter">
            <button onclick="window.closeAdminPortal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <h2 class="font-display font-bold text-xl text-white mb-5">POL</h2>

            <form onsubmit="window.handlePasswordSubmit(event)" class="space-y-4">
                <input 
                    type="password" 
                    id="admin-password-input" 
                    placeholder="••••••••"
                    autocomplete="off"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    class="w-full bg-black/60 border border-white/15 focus:border-purple-500 rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none"
                >
                <p id="password-error" class="hidden text-xs text-rose-400 font-mono">Accès refusé</p>

                <button type="submit" class="w-full py-3 rounded-xl bg-white text-black font-semibold text-sm hover:opacity-90 transition">
                    Déverrouiller
                </button>
            </form>
        </div>

        <!-- Upload & Folder Sync Dashboard -->
        <div id="admin-dashboard-view" class="hidden glass-panel rounded-3xl max-w-lg w-full p-6 border border-white/15 relative my-auto max-h-[92vh] flex flex-col">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/10 shrink-0">
                <div class="flex items-center gap-2.5">
                    <h2 class="font-display font-bold text-xl text-white">POL // Ajouter</h2>
                    <span id="github-scan-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-mono bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                        Scan Dossier Actif
                    </span>
                </div>
                <button onclick="window.closeAdminPortal()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="overflow-y-auto pr-1 space-y-4 flex-1">
                <!-- Request Upload Form -->
                <form id="add-track-form" onsubmit="window.handleAddTrack(event)" class="space-y-3">
                    <div>
                        <select id="track-space-select" required class="w-full bg-[#0d0d17] border border-white/15 focus:border-purple-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none">
                            <option value="rock2024">Premier enregistrement au téléphone 2024 Rock</option>
                            <option value="hiphop">Hip-Hop</option>
                            <option value="jazz">Jazz</option>
                            <option value="accapella">Avec Accapella</option>
                            <option value="melancolie">Mélancolie / Romantique</option>
                        </select>
                    </div>

                    <div>
                        <input 
                            type="text" 
                            id="track-title-input" 
                            required
                            placeholder="Titre du morceau" 
                            class="w-full bg-[#0d0d17] border border-white/15 focus:border-purple-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none"
                        >
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <!-- Cover / PP File Selection (Captures exact filename in GitHub folder) -->
                        <div class="relative rounded-2xl border border-dashed border-white/20 hover:border-amber-500/60 bg-black/40 p-3 text-center transition">
                            <input 
                                type="file" 
                                id="track-cover-file" 
                                accept="image/*" 
                                onchange="window.handleCoverFileSelect(event)"
                                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                            >
                            <div class="space-y-1 pointer-events-none">
                                <div class="w-8 h-8 rounded-xl bg-white/5 text-amber-300 flex items-center justify-center mx-auto overflow-hidden">
                                    <i data-lucide="image" class="w-4 h-4"></i>
                                </div>
                                <p id="cover-filename-preview" class="text-[11px] font-mono text-zinc-300 truncate">PP (Image)</p>
                            </div>
                        </div>

                        <!-- Audio MP3/WAV File Selection (Captures exact filename in GitHub folder) -->
                        <div class="relative rounded-2xl border border-dashed border-white/20 hover:border-purple-500/60 bg-black/40 p-3 text-center transition">
                            <input 
                                type="file" 
                                id="track-audio-file" 
                                accept=".mp3,.wav,audio/*" 
                                required
                                onchange="window.handleAudioFileSelect(event)"
                                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                            >
                            <div class="space-y-1 pointer-events-none">
                                <div class="w-8 h-8 rounded-xl bg-white/5 text-purple-300 flex items-center justify-center mx-auto">
                                    <i data-lucide="music" class="w-4 h-4"></i>
                                </div>
                                <p id="audio-filename-preview" class="text-[11px] font-mono text-zinc-300 truncate">MP3 / WAV</p>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submit-request-btn" class="w-full py-2.5 rounded-xl bg-white text-black font-semibold text-sm hover:opacity-90 transition flex items-center justify-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Enregistrer la demande d'upload</span>
                    </button>
                </form>

                <!-- Filter & Rescan Folder Controls -->
                <div class="pt-3 border-t border-white/10 flex items-center justify-between gap-2">
                    <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer select-none">
                        <input type="checkbox" id="only-verified-toggle" checked onchange="window.toggleVerifiedFilter(event)" class="rounded bg-black border-white/20 text-purple-500 focus:ring-0">
                        <span>Afficher uniquement si présent dans le dossier GitHub</span>
                    </label>
                    <button onclick="window.scanGitHubFolderAndVerifyAll(true)" class="px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-zinc-200 font-mono text-[11px] flex items-center gap-1.5 border border-white/10 transition shrink-0">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                        <span>Scanner</span>
                    </button>
                </div>

                <!-- Detected Files in GitHub Folder & Upload Requests Status List -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-[11px] font-mono text-zinc-400">
                        <span>DEMANDES D'UPLOAD & ÉTAT DU DOSSIER GITHUB</span>
                        <span id="requests-count-label">0</span>
                    </div>
                    <div id="admin-requests-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
                </div>

                <!-- 1-Click Export for GitHub Folder -->
                <div class="pt-3 border-t border-white/10 grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <button type="button" onclick="window.downloadUpdatedIndexHtml()" class="py-2.5 px-3 rounded-xl bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/40 text-purple-200 text-xs font-mono flex items-center justify-center gap-2 transition">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>Télécharger index.html</span>
                    </button>
                    <button type="button" onclick="window.downloadTracksJson()" class="py-2.5 px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/35 text-amber-200 text-xs font-mono flex items-center justify-center gap-2 transition">
                        <i data-lucide="file-json" class="w-3.5 h-3.5"></i>
                        <span>Télécharger tracks.json</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-20 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <audio id="html5-audio" preload="metadata" crossorigin="anonymous"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /********************************************************************
         * 1. SPACES & THEMES (Strictly Titles & Visual Themes Only)
         ********************************************************************/
        const SPACES = {
            'all': {
                id: 'all',
                title: 'Tous',
                headerTitle: 'POL',
                icon: 'disc-3',
                primary: '#a855f7',
                secondary: '#f59e0b',
                tertiary: '#ec4899',
                pillClass: 'from-purple-600 to-amber-500'
            },
            'rock2024': {
                id: 'rock2024',
                title: 'Premier enregistrement au téléphone 2024 Rock',
                headerTitle: 'Premier enregistrement au téléphone 2024 Rock',
                icon: 'smartphone',
                primary: '#ef4444',

        /********************************************************************
         * 2. 100% RELIABLE OBFUSCATED PASSWORD CHECK (NO CLEARTEXT / NO CRYPTO.SUBTLE)
         * Works everywhere: local file://, GitHub Pages, Desktop & Mobile
         ********************************************************************/
        function checkPassword(input) {
            const clean = (input || '').trim().toLowerCase();
            const codes = [112, 97, 112, 101, 100, 117, 112, 111, 48, 54];
            if (clean.length !== codes.length) return false;
            for (let i = 0; i < codes.length; i++) {
                if (clean.charCodeAt(i) !== codes[i]) return false;
            }
            return true;
        }
        const verifyPassword = checkPassword;

         * 3. GLOBAL STATE & EMBEDDED MANIFEST LOADER

        function normalizeSpaceKey(key) {
            if (key === 'rock-2024') return 'rock2024';
            return SPACES[key] ? key : 'rock2024';
        }

        function loadEmbeddedRequests() {
            try {
                const scriptEl = document.getElementById('pol-embedded-requests');
                if (scriptEl && scriptEl.textContent) {
                    const parsed = JSON.parse(scriptEl.textContent);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(item => {
                            if (item && item.audioFile) {
                                const audioFile = item.audioFile.replace(/^\.\//, '');
                                const coverFile = (item.coverFile || '').replace(/^\.\//, '');
                                const id = item.id || ('pol-' + audioFile.replace(/[^a-zA-Z0-9_-]/g, '_'));
                                allTrackRequests.push({
                                    id,
                                    title: item.title || audioFile.replace(/\.(mp3|wav)$/i, ''),
                                    space: normalizeSpaceKey(item.space),
                                    audioFile,
                                    coverFile,
                                    createdAt: item.createdAt || 0,
                                    audioExists: false,
                                    coverExists: false
                                });
                            }
                        });
                    }
                }
            } catch (e) {}
        }

        /********************************************************************
         * 4. FIREBASE CLOUD SYNC + GITHUB REPOSITORY FOLDER SCANNER
         ********************************************************************/
        async function initCloudAndFolderSync() {
            loadEmbeddedRequests();
            await scanGitHubFolderAndVerifyAll(false);

            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            subscribeToGlobalUploadRequests();
                        }
                    });
                }
            } catch (err) {
                console.warn("Cloud sync fallback:", err);
            }
        }

        function subscribeToGlobalUploadRequests() {
            if (!db || !currentUser) return;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'track_requests');

            onSnapshot(colRef, async (snapshot) => {
                const cloudTracks = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data && data.audioFile) {
                        cloudTracks.push({
                            id: docSnap.id,
                            title: data.title || data.audioFile,
                            space: normalizeSpaceKey(data.space),
                            audioFile: data.audioFile,
                            coverFile: data.coverFile || '',
                            createdAt: data.createdAt || 0,
                            audioExists: false,
                            coverExists: false
                        });
                    }
                });

                const mergedMap = new Map();
                allTrackRequests.forEach(t => mergedMap.set(t.id, t));
                cloudTracks.forEach(t => mergedMap.set(t.id, t));

                allTrackRequests = Array.from(mergedMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                await scanGitHubFolderAndVerifyAll(false);
            }, (error) => {
                console.warn("Snapshot error:", error);
            });
        }

        async function scanGitHubFolderAndVerifyAll(showNotification = false) {
            const badge = document.getElementById('github-scan-badge');
            if (badge) badge.textContent = 'Scan en cours...';

            // A. Check ./tracks.json in the same GitHub folder if present
            try {
                const res = await fetch('./tracks.json?t=' + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    const jsonTracks = await res.json();
                    if (Array.isArray(jsonTracks)) {
                        const existingIds = new Set(allTrackRequests.map(t => t.id));
                        jsonTracks.forEach(jt => {
                            const audioFile = (jt.audioFile || jt.audioUrl || '').replace(/^\.\//, '');
                            const coverFile = (jt.coverFile || jt.coverUrl || '').replace(/^\.\//, '');
                            const id = jt.id || ('pol-' + audioFile.replace(/[^a-zA-Z0-9_-]/g, '_'));
                            if (audioFile && !existingIds.has(id)) {
                                allTrackRequests.push({
                                    id,
                                    title: jt.title || audioFile.replace(/\.(mp3|wav)$/i, ''),
                                    space: normalizeSpaceKey(jt.space),
                                    audioFile,
                                    coverFile,
                                    createdAt: jt.createdAt || 0,
                                    audioExists: false,
                                    coverExists: false
                                });
                                existingIds.add(id);
                            }
                        });
                    }
                }
            } catch (e) {}

            // B. Auto-detect GitHub repository if hosted on *.github.io to inspect folder contents
            try {
                const host = window.location.hostname;
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                if (host.endsWith('.github.io')) {
                    const owner = host.replace('.github.io', '');
                    const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
                    const subDir = pathParts.length > 1 ? pathParts.slice(1, -1).join('/') : '';
                    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${subDir}`;
                    const ghRes = await fetch(apiUrl, { cache: 'no-store' });
                    if (ghRes.ok) {
                        const items = await ghRes.json();
                        if (Array.isArray(items)) {
                            githubFolderFiles.clear();
                            items.forEach(item => {
                                if (item && item.name) {
                                    githubFolderFiles.add(item.name);
                                }
                            });
                        }
                    }
                }
            } catch (e) {}

            // C. Verify each requested track's audioFile and coverFile in the folder (./filename)
            await Promise.all(allTrackRequests.map(async (track) => {
                track.audioExists = await checkFileInFolder(track.audioFile);
                track.coverExists = track.coverFile ? await checkFileInFolder(track.coverFile) : false;
            }));

            if (badge) {
                const verifiedCount = allTrackRequests.filter(t => t.audioExists).length;
                badge.textContent = `${verifiedCount}/${allTrackRequests.length} dans le dossier`;
            }

            renderSpaceTabs();
            renderTracksGrid();
            renderAdminRequestsList();

            if (showNotification) {
                showToast('Dossier GitHub scanné et synchronisé');
            }
        }

        async function checkFileInFolder(filename) {
            if (!filename) return false;
            const cleanName = filename.replace(/^\.\//, '').trim();
            if (!cleanName) return false;

            // 1. Check if listed in GitHub API folder contents
            if (githubFolderFiles.has(cleanName)) {
                return true;
            }

            // 2. Direct relative HTTP HEAD check on the same server/folder (./filename)
            try {
                const encoded = encodeURI(cleanName);
                const headRes = await fetch(`./${encoded}`, { method: 'HEAD', cache: 'no-store' });
                if (headRes.ok) {
                    const contentType = (headRes.headers.get('content-type') || '').toLowerCase();
                    if (!contentType.includes('text/html')) {
                        return true;
                    }
                }
            } catch (e) {}

            return false;
        }

        /********************************************************************
         * 6. AUDIO PLAYER & WEB AUDIO VISUALIZER (PLAYS FROM ./FILENAME)
         ********************************************************************/
        const audioEl = document.getElementById('html5-audio');
        let audioCtx = null;
        let analyser = null;
        let mediaSourceNode = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                analyser.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        async function playTrackById(trackId) {
            const track = allTrackRequests.find(t => t.id === trackId);
            if (!track) return;

            if (currentTrackId === track.id) {
                togglePlay();
                return;
            }

            currentTrackId = track.id;
            const spaceObj = SPACES[normalizeSpaceKey(track.space)] || SPACES['all'];
            const coverSrc = track.coverFile ? `./${encodeURI(track.coverFile)}` : DEFAULT_COVER;
            const audioSrc = `./${encodeURI(track.audioFile)}`;

            const playerCoverEl = document.getElementById('player-cover');
            const vinylCoverEl = document.getElementById('hero-vinyl-cover');
            playerCoverEl.onerror = () => { playerCoverEl.src = DEFAULT_COVER; };
            vinylCoverEl.onerror = () => { vinylCoverEl.src = DEFAULT_COVER; };
            playerCoverEl.src = coverSrc;
            vinylCoverEl.src = coverSrc;

            document.getElementById('player-title').textContent = track.title;
            document.getElementById('player-space-badge').textContent = spaceObj.title;
            document.getElementById('player-space-badge').style.color = spaceObj.primary;

            audioEl.pause();
            audioEl.src = audioSrc;
            audioEl.volume = parseFloat(document.getElementById('player-volume').value || 0.85);

            try {
                ensureAudioContext();
                if (!mediaSourceNode) {
                    mediaSourceNode = audioCtx.createMediaElementSource(audioEl);
                    mediaSourceNode.connect(analyser);
                }
                await audioEl.play();
                setPlayingState(true);
            } catch (err) {
                setPlayingState(false);
                showToast(`En attente du fichier ./${track.audioFile} dans le dossier GitHub`);
            }
        }

        function setPlayingState(playing) {
            isPlaying = playing;
            const playIcon = document.getElementById('master-play-icon');
            const vinyl = document.getElementById('hero-vinyl');

            if (playing) {
                playIcon.setAttribute('data-lucide', 'pause');
                vinyl.classList.add('animate-spin-slow');
            } else {
                playIcon.setAttribute('data-lucide', 'play');
                vinyl.classList.remove('animate-spin-slow');
            }

            lucide.createIcons();
            renderTracksGrid();
        }

        function togglePlay() {
            const visible = getVisibleTracks();
            if (!currentTrackId && visible.length > 0) {
                playTrackById(visible[0].id);
                return;
            }
            if (isPlaying) {
                audioEl.pause();
                setPlayingState(false);
            } else {
                ensureAudioContext();
                audioEl.play().then(() => setPlayingState(true)).catch(() => setPlayingState(false));
            }
        }

        function playSpaceTracks() {
            const visible = getVisibleTracks();
            if (visible.length === 0) return;
            playTrackById(visible[0].id);
        }

        function nextTrack() {
            const visible = getVisibleTracks();
            if (visible.length === 0) return;
            const idx = visible.findIndex(t => t.id === currentTrackId);
            const nextItem = visible[(idx + 1) % visible.length];
            playTrackById(nextItem.id);
        }

        function prevTrack() {
            const visible = getVisibleTracks();
            if (visible.length === 0) return;
            const idx = visible.findIndex(t => t.id === currentTrackId);
            const prevItem = visible[(idx - 1 + visible.length) % visible.length];
            playTrackById(prevItem.id);
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audioEl.addEventListener('timeupdate', () => {
            const cur = audioEl.currentTime;
            const dur = audioEl.duration || 0;
            const pct = dur > 0 ? (cur / dur) * 100 : 0;
            document.getElementById('player-seek').value = pct;
            document.getElementById('player-progress-fill').style.width = `${pct}%`;
            document.getElementById('player-current-time').textContent = formatTime(cur);
            document.getElementById('player-duration').textContent = formatTime(dur);
        });

        audioEl.addEventListener('ended', () => nextTrack());

        document.getElementById('player-seek').addEventListener('input', (e) => {
            const pct = parseFloat(e.target.value);
            document.getElementById('player-progress-fill').style.width = `${pct}%`;
            if (audioEl.duration) {
                audioEl.currentTime = (pct / 100) * audioEl.duration;
            }
        });

        document.getElementById('player-volume').addEventListener('input', (e) => {
            audioEl.volume = parseFloat(e.target.value);
        });

        function toggleMute() {
            audioEl.muted = !audioEl.muted;
            document.getElementById('volume-icon').setAttribute('data-lucide', audioEl.muted ? 'volume-x' : 'volume-2');
            lucide.createIcons();
        }

        function startVisualizerLoop() {
            const canvas = document.getElementById('visualizer-canvas');
            const ctx = canvas.getContext('2d');
            const dataArray = new Uint8Array(32);

            function draw() {
                requestAnimationFrame(draw);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (analyser && isPlaying) {
                    analyser.getByteFrequencyData(dataArray);
                }

                const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim() || '#a855f7';
                for (let i = 0; i < 15; i++) {
                    const val = isPlaying ? Math.max(22, dataArray[i]) : 15;
                    const barHeight = Math.max(3, (val / 255) * canvas.height);
                    const x = i * 6;
                    const y = canvas.height - barHeight;

                    ctx.fillStyle = isPlaying ? primaryColor : 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.roundRect(x, y, 4, barHeight, 2);
                    ctx.fill();
                }
            }
            draw();
        }

        }

        function closeAdminPortal() {
            const modal = document.getElementById('admin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handlePasswordSubmit(e) {
            e.preventDefault();
            const val = document.getElementById('admin-password-input').value;
            if (checkPassword(val)) {
                isAdminUnlocked = true;
                document.getElementById('admin-password-input').value = '';
                document.getElementById('password-error').classList.add('hidden');
                document.getElementById('admin-lock-icon').setAttribute('data-lucide', 'unlock');
                lucide.createIcons();
                renderTracksGrid();
                showAdminDashboard();
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        }

        function showAdminDashboard() {
            document.getElementById('password-gate-view').classList.add('hidden');
            document.getElementById('admin-dashboard-view').classList.remove('hidden');
            renderAdminRequestsList();
            lucide.createIcons();
        }

        function handleAudioFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            pendingAudioFilename = file.name.trim();
            document.getElementById('audio-filename-preview').textContent = pendingAudioFilename;

            const titleInput = document.getElementById('track-title-input');
            if (!titleInput.value.trim()) {
                titleInput.value = pendingAudioFilename.replace(/\.(mp3|wav|flac|m4a)$/i, '').replace(/[_-]/g, ' ');
            }
        }

        function handleCoverFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            pendingCoverFilename = file.name.trim();
            document.getElementById('cover-filename-preview').textContent = pendingCoverFilename;
        }

        async function handleAddTrack(e) {
            e.preventDefault();
            if (!pendingAudioFilename) return;

            const btn = document.getElementById('submit-request-btn');
            btn.disabled = true;

            const space = normalizeSpaceKey(document.getElementById('track-space-select').value);
            const title = document.getElementById('track-title-input').value.trim();
            const audioFile = pendingAudioFilename;
            const coverFile = pendingCoverFilename || '';

            const safeKey = 'pol-' + audioFile.replace(/[^a-zA-Z0-9_-]/g, '_');
            const newReq = {
                id: safeKey,
                title,
                space,
                audioFile,
                coverFile,
                createdAt: Date.now()
            };

            if (db && currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'track_requests', safeKey);
                    await setDoc(docRef, newReq);
                } catch (err) {
                    console.warn("Firestore save error:", err);
                }
            }

            const existingIdx = allTrackRequests.findIndex(t => t.id === safeKey);
            if (existingIdx >= 0) {
                allTrackRequests[existingIdx] = { ...allTrackRequests[existingIdx], ...newReq };
            } else {
                allTrackRequests.unshift({ ...newReq, audioExists: false, coverExists: false });
            }

            syncEmbeddedManifestTag();
            await scanGitHubFolderAndVerifyAll(false);

            document.getElementById('track-title-input').value = '';
            document.getElementById('track-audio-file').value = '';
            document.getElementById('track-cover-file').value = '';
            document.getElementById('audio-filename-preview').textContent = 'MP3 / WAV';
            document.getElementById('cover-filename-preview').textContent = 'PP (Image)';
            pendingAudioFilename = '';
            pendingCoverFilename = '';
            btn.disabled = false;

            const addedTrack = allTrackRequests.find(t => t.id === safeKey);
            if (addedTrack && addedTrack.audioExists) {
                showToast(`✅ ${audioFile} détecté dans le dossier GitHub et affiché !`);
                switchSpace(space);
            } else {
                showToast(`Demande enregistrée : place "${audioFile}" dans ton dossier GitHub.`);
            }
        }

        async function deleteTrackRequest(e, id) {
            e.stopPropagation();
            allTrackRequests = allTrackRequests.filter(t => t.id !== id);
            syncEmbeddedManifestTag();
            renderTracksGrid();
            renderAdminRequestsList();

            if (db && currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'track_requests', id);
                    await deleteDoc(docRef);
                } catch (err) {}
            }
        }

        function syncEmbeddedManifestTag() {
            const cleanExport = allTrackRequests.map(t => ({
                id: t.id,
                title: t.title,
                space: normalizeSpaceKey(t.space),
                audioFile: t.audioFile,
                coverFile: t.coverFile || '',
                createdAt: t.createdAt || Date.now()
            }));
            const scriptEl = document.getElementById('pol-embedded-requests');
            if (scriptEl) {
                scriptEl.textContent = JSON.stringify(cleanExport, null, 2);
            }
        }

        function downloadUpdatedIndexHtml() {
            syncEmbeddedManifestTag();
            const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('index.html téléchargé avec toutes tes demandes intégrées !');
        }

        function downloadTracksJson() {
            const cleanExport = allTrackRequests.map(t => ({
                id: t.id,
                title: t.title,
                space: normalizeSpaceKey(t.space),
                audioFile: t.audioFile,
                coverFile: t.coverFile || '',
                createdAt: t.createdAt || Date.now()
            }));
            const blob = new Blob([JSON.stringify(cleanExport, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tracks.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('tracks.json téléchargé !');
        }

        function toggleVerifiedFilter(e) {
            onlyShowVerifiedFolderFiles = e.target.checked;
            renderTracksGrid();
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-xl border border-white/15 bg-[#12121e]/95 text-xs font-mono text-white shadow-xl animate-card-enter`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // Expose handlers to window
        window.checkPassword = checkPassword;
        window.verifyPassword = verifyPassword;
        window.switchSpace = switchSpace;
        window.openAdminPortal = openAdminPortal;
        window.closeAdminPortal = closeAdminPortal;
        window.handlePasswordSubmit = handlePasswordSubmit;
        window.handleAudioFileSelect = handleAudioFileSelect;
        window.handleCoverFileSelect = handleCoverFileSelect;
        window.handleAddTrack = handleAddTrack;
        window.deleteTrackRequest = deleteTrackRequest;
        window.scanGitHubFolderAndVerifyAll = scanGitHubFolderAndVerifyAll;
        window.toggleVerifiedFilter = toggleVerifiedFilter;
        window.downloadUpdatedIndexHtml = downloadUpdatedIndexHtml;
        window.downloadTracksJson = downloadTracksJson;
        window.playTrackById = playTrackById;
        window.togglePlay = togglePlay;
        window.playSpaceTracks = playSpaceTracks;
        window.nextTrack = nextTrack;
        window.prevTrack = prevTrack;
        window.toggleMute = toggleMute;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderSpaceTabs();
            startVisualizerLoop();
            initCloudAndFolderSync();
        });
    </script>
</body>
</html>
